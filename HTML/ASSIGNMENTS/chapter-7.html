<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<style>
    #user-form {
        width: 100%;
        height: 100vh;
        border: 1px solid black;
        background-color: gray;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
</style>
<body>
    <div id="user-form">
        <h1> User Form</h1>
        <label for="username">Username</label>
        <input type="text" name="username" placeholder="Enter your username">
        <br>
        <br>
        <label for="email">E-mail</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br>
        <br>
        <label for="phone">Phone no </label>
        <input type="tel" name="phone" placeholder="Enter your phone number">
        <br>
        <br>

        <label for="password">Password</label>
        <input type="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" placeholder="Enter your password">
        <br>
        <br>

        <textarea name="message">Add Your Comments</textarea>

        <br>
        <br>
        <button>Submit</button>
    </div>
</body>
</html>
